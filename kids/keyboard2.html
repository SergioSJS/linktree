<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprenda as Palavras</title>
  <style>
    body {
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    input {
      background: transparent;
      border: none;
      outline: none;
      color: white;
      caret-color: white;
      font-family: inherit;
      font-size: calc(6vw + 6vh);
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 0.05em;
      width: 90vw;
      z-index: 1;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .voz-seletor {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 12px;
      max-width: 40vw;
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }

    .voz-seletor:hover, .voz-seletor:focus {
      opacity: 1;
    }
  </style>
</head>
<body>
  <input type="text" id="wordInput" autofocus autocomplete="off" autocapitalize="off" spellcheck="false">
  <canvas id="explosionCanvas"></canvas>
  <select id="vozSelect" class="voz-seletor" title="Voz"></select>

  <script>
    const input = document.getElementById('wordInput');
    const canvas = document.getElementById('explosionCanvas');
    const ctx = canvas.getContext('2d');
    const vozSelect = document.getElementById('vozSelect');

    document.body.addEventListener('click', (event) => {
      if (event.target === vozSelect) return; // não rouba foco do dropdown de voz
      input.focus();
    });

    let particles = [];
    let animating = false;

    function createExplosion(x, y) {
      particles = [];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: x,
          y: y,
          radius: Math.random() * 4 + 1,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          speed: Math.random() * 6 + 2,
          angle: Math.random() * Math.PI * 2,
          life: Math.random() * 30 + 20
        });
      }
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(particle => {
        particle.x += Math.cos(particle.angle) * particle.speed;
        particle.y += Math.sin(particle.angle) * particle.speed;
        particle.life--;
        if (particle.life > 0) {
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          ctx.fillStyle = particle.color;
          ctx.fill();
        }
      });
      particles = particles.filter(particle => particle.life > 0);
    }

    function animateParticles() {
      if (animating) return;
      animating = true;
      function step() {
        updateParticles();
        if (particles.length > 0) {
          requestAnimationFrame(step);
        } else {
          animating = false;
        }
      }
      requestAnimationFrame(step);
    }

    // Lista de vozes carrega async em alguns navegadores (Chrome)
    const VOZ_STORAGE_KEY = 'meioorc-kids-voz';
    let vozesPtBR = [];

    function carregarVozes() {
      const todas = window.speechSynthesis.getVoices();
      vozesPtBR = todas.filter(v => v.lang.toLowerCase().startsWith('pt'));
      popularSelectVozes(vozesPtBR.length > 0 ? vozesPtBR : todas);
    }

    function popularSelectVozes(lista) {
      const atual = vozSelect.value;
      vozSelect.innerHTML = '<option value="">Automático (melhor voz)</option>';
      lista.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.voiceURI;
        opt.textContent = `${v.name} (${v.lang})`;
        vozSelect.appendChild(opt);
      });
      const salva = localStorage.getItem(VOZ_STORAGE_KEY);
      if (salva && lista.some(v => v.voiceURI === salva)) {
        vozSelect.value = salva;
      } else if (atual && lista.some(v => v.voiceURI === atual)) {
        vozSelect.value = atual;
      }
    }

    carregarVozes();
    if ('onvoiceschanged' in window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = carregarVozes;
    }

    vozSelect.addEventListener('change', () => {
      if (vozSelect.value) {
        localStorage.setItem(VOZ_STORAGE_KEY, vozSelect.value);
      } else {
        localStorage.removeItem(VOZ_STORAGE_KEY);
      }
    });

    function melhorVoz() {
      if (vozesPtBR.length === 0) return null;
      const pontuar = v => {
        let score = 0;
        if (v.lang.toLowerCase() === 'pt-br') score += 10; // prioriza pt-BR sobre pt-PT
        if (/enhanced|premium|natural|neural/i.test(v.name)) score += 5; // vozes de melhor qualidade, se instaladas
        if (v.localService) score += 1; // não depende de rede
        return score;
      };
      return [...vozesPtBR].sort((a, b) => pontuar(b) - pontuar(a))[0];
    }

    function vozEscolhida() {
      if (vozSelect.value) {
        const escolhida = window.speechSynthesis.getVoices().find(v => v.voiceURI === vozSelect.value);
        if (escolhida) return escolhida;
      }
      return melhorVoz();
    }

    input.addEventListener('keydown', function(event) {
      if (event.key !== 'Enter') return;
      event.preventDefault();

      const palavra = input.value.trim();
      if (!palavra) return;

      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      createExplosion(centerX, centerY);
      animateParticles();

      if (!window.speechSynthesis) {
        console.error('API de síntese de fala não suportada neste navegador.');
        input.value = '';
        return;
      }

      try {
        window.speechSynthesis.cancel(); // corta fala anterior pra não empilhar
        const utterance = new SpeechSynthesisUtterance(palavra);
        utterance.lang = 'pt-BR';
        const voz = vozEscolhida();
        if (voz) utterance.voice = voz;
        // limpa o campo só depois que a palavra terminar de ser lida
        utterance.onend = () => { input.value = ''; };
        utterance.onerror = () => { input.value = ''; };
        window.speechSynthesis.speak(utterance);
      } catch (error) {
        console.error('Erro ao tentar emitir som:', error);
        input.value = '';
      }
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  </script>
</body>
</html>
